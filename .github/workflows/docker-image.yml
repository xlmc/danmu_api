name: Publish Docker Image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publisher at a time: date counters and latest must not race.
concurrency:
  group: ghcr-publish-main
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'xlmc/danmu_api' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code and version history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Reserve one source and image version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "RELEASE_DIR=$RUNNER_TEMP/danmu-release" >> "$GITHUB_ENV"
          node .github/scripts/build-release.mjs prepare "$RUNNER_TEMP/danmu-release"

      - name: Install dependencies and test before publishing
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push versioned image (not latest)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify both published platforms by digest
        id: verify
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: node .github/scripts/build-release.mjs verify "$RELEASE_DIR"

      - name: Record outcome and publish only verified images
        if: always() && steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: node .github/scripts/build-release.mjs finish "$RELEASE_DIR"

      - name: Retain version and update notes for troubleshooting
        if: always() && steps.release.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_DIR }}/
          retention-days: 90
