name: Publish Docker Image to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 从 danmu_api/configs/globals.js 中读取版本号
      - name: Read version from globals.js
        id: version
        run: |
          VERSION=$(grep "VERSION:" danmu_api/configs/globals.js | sed -E "s/.*VERSION: '(.*)'.*/\1/")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      # 根据分支设置版本号后缀
      - name: Set version suffix
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "VERSION_TAG=${{ env.VERSION }}-test" >> $GITHUB_ENV
          else
            echo "VERSION_TAG=${{ env.VERSION }}" >> $GITHUB_ENV
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$DOCKER_USERNAME"
          IMAGE="$DOCKER_USERNAME/danmu-api"
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$IMAGE:${VERSION_TAG}" \
            -t "$IMAGE:latest" \
            --push .
