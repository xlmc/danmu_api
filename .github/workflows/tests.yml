name: Self-use Regression Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 22 (Docker runtime)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test self-use code and safe sync behavior
        run: npm test
      - name: Validate NAS Compose uses GHCR latest without image variables
        run: |
          docker compose -f compose.nas.yml config --quiet
          docker compose -f compose.nas.yml config --images | grep -Fx 'ghcr.io/xlmc/danmu_api:latest'
      - name: Build and smoke test native Docker image
        run: |
          docker build --tag danmu-api-ci:${{ github.sha }} .
          docker run --rm danmu-api-ci:${{ github.sha }} node --input-type=module -e "
            import { transformSync } from 'esbuild';
            transformSync('const value = 1', { minify: true });
            console.log('Native runtime passed:', process.arch);
          "
